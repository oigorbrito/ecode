name: Branch Qualification

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to qualify
        required: true
        default: baseline/ecode-bootstrap
  push:
    branches: [main]
    paths:
      - .github/workflows/branch-qualification.yml

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || 'baseline/ecode-bootstrap' }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest pytest-asyncio ruff==0.16.7 anthropic openai backoff
      - name: Lint
        run: ruff check .
      - name: Compile
        run: python -m compileall -q analysis coding_agent.py coding_agent_polyglot.py ecode.py ecode_core llm.py llm_withtools.py self_improve_step.py swe_bench polyglot prompts tools utils test_swebench.py
      - name: Tests
        run: python -m pytest -q
