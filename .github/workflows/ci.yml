name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Tests and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Install check tools
        run: python -m pip install --disable-pip-version-check pytest pytest-asyncio ruff==0.16.7

      - name: Lint
        run: ruff check .

      - name: Compile Python sources
        run: >-
          python -m compileall -q analysis coding_agent.py coding_agent_polyglot.py ecode.py ecode_core
          llm.py llm_withtools.py self_improve_step.py swe_bench polyglot prompts tools utils
          test_swebench.py

      - name: Run tests
        run: python -m pytest -q
